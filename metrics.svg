<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="panelBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c0204" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#050102" stop-opacity="0.9" />
    </linearGradient>

    <filter id="glowCrimson" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <clipPath id="telemetryClip">
      <rect x="-70" y="-35" width="140" height="70" rx="3" />
    </clipPath>
  </defs>

  <style>
    text {
      font-family: 'Courier New', Courier, monospace;
      user-select: none;
    }
    
    .panel-title {
      font-weight: bold;
      letter-spacing: 2px;
      font-size: 11px;
    }

    .tech-label {
      font-size: 9px;
      letter-spacing: 1px;
      fill: #ffffff;
      opacity: 0.6;
    }

    .status-text {
      font-weight: bold;
      font-size: 10px;
      letter-spacing: 1px;
    }
  </style>

  <!-- Outer frame -->
  <rect x="10" y="10" width="980" height="200" rx="6" fill="url(#panelBg)" stroke="#ff003c" stroke-width="1.2" opacity="0.35" />
  
  <!-- Panel Dividers -->
  <line x1="250" y1="15" x2="250" y2="205" stroke="#ff003c" stroke-width="1" stroke-dasharray="4,4" opacity="0.2" />
  <line x1="500" y1="15" x2="500" y2="205" stroke="#ff003c" stroke-width="1" stroke-dasharray="4,4" opacity="0.2" />
  <line x1="750" y1="15" x2="750" y2="205" stroke="#ff003c" stroke-width="1" stroke-dasharray="4,4" opacity="0.2" />

  <!-- ==================== PANEL 1: NEURAL CAPACITY ==================== -->
  <g>
    <text x="130" y="38" fill="#ffcc00" text-anchor="middle" class="panel-title" filter="url(#glowGold)">NEURAL INFUSION</text>
    
    <g transform="translate(130, 110)">
      <!-- Ring Track -->
      <circle r="42" fill="none" stroke="#25050c" stroke-width="5.5" />
      <!-- Animated Glow Ring -->
      <circle r="42" fill="none" stroke="#ff003c" stroke-width="5.5" stroke-dasharray="263.9" stroke-dashoffset="15" transform="rotate(-90)" filter="url(#glowCrimson)">
        <animate attributeName="stroke-dashoffset" values="20;5;20" dur="2.5s" repeatCount="indefinite" />
      </circle>
      <!-- Pulsing Core -->
      <circle r="6" fill="#ffcc00">
        <animate attributeName="r" values="4;7;4" dur="1.2s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.6;1;0.6" dur="1.2s" repeatCount="indefinite" />
      </circle>
    </g>
    
    <text x="130" y="182" fill="#ff003c" text-anchor="middle" class="status-text">
      CLASS: COMP-V EXTREME
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" repeatCount="indefinite" />
    </text>
    <text x="130" y="196" class="tech-label" text-anchor="middle">PYTORCH | LANGGRAPH | TENSORRT</text>
  </g>

  <!-- ==================== PANEL 2: CUDA PERFORMANCE ==================== -->
  <g>
    <text x="380" y="38" fill="#ffcc00" text-anchor="middle" class="panel-title" filter="url(#glowGold)">CUDA SPEEDUP</text>
    
    <g transform="translate(380, 110)">
      <!-- Segmented Bar Frame -->
      <rect x="-65" y="-18" width="130" height="36" fill="none" stroke="#ff003c" stroke-width="0.8" opacity="0.3" rx="2" />
      <!-- Segments -->
      <rect x="-54" y="-10" width="10" height="20" rx="1.5" fill="#ff003c">
        <animate attributeName="opacity" values="0.25;1;0.25" dur="1.8s" begin="0s" repeatCount="indefinite" />
      </rect>
      <rect x="-40" y="-10" width="10" height="20" rx="1.5" fill="#ff003c">
        <animate attributeName="opacity" values="0.25;1;0.25" dur="1.8s" begin="0.15s" repeatCount="indefinite" />
      </rect>
      <rect x="-26" y="-10" width="10" height="20" rx="1.5" fill="#ff003c">
        <animate attributeName="opacity" values="0.25;1;0.25" dur="1.8s" begin="0.3s" repeatCount="indefinite" />
      </rect>
      <rect x="-12" y="-10" width="10" height="20" rx="1.5" fill="#ff003c">
        <animate attributeName="opacity" values="0.25;1;0.25" dur="1.8s" begin="0.45s" repeatCount="indefinite" />
      </rect>
      <rect x="2" y="-10" width="10" height="20" rx="1.5" fill="#ffcc00">
        <animate attributeName="opacity" values="0.25;1;0.25" dur="1.8s" begin="0.6s" repeatCount="indefinite" />
      </rect>
      <rect x="16" y="-10" width="10" height="20" rx="1.5" fill="#ffcc00">
        <animate attributeName="opacity" values="0.25;1;0.25" dur="1.8s" begin="0.75s" repeatCount="indefinite" />
      </rect>
      <rect x="30" y="-10" width="10" height="20" rx="1.5" fill="#ffcc00">
        <animate attributeName="opacity" values="0.25;1;0.25" dur="1.8s" begin="0.9s" repeatCount="indefinite" />
      </rect>
      <rect x="44" y="-10" width="10" height="20" rx="1.5" fill="#ffffff">
        <animate attributeName="opacity" values="0.25;1;0.25" dur="1.8s" begin="1.05s" repeatCount="indefinite" />
      </rect>
    </g>
    
    <text x="380" y="182" fill="#ffffff" text-anchor="middle" class="status-text" opacity="0.9">CAPACITY: 12.5X ACCEL</text>
    <text x="380" y="196" class="tech-label" text-anchor="middle">CUDA | C++ | DOCKER | LINUX</text>
  </g>

  <!-- ==================== PANEL 3: ROVER NAVIGATION ==================== -->
  <g>
    <text x="630" y="38" fill="#ffcc00" text-anchor="middle" class="panel-title" filter="url(#glowGold)">ROVER TRACKING</text>
    
    <g transform="translate(630, 110)">
      <!-- Radar grid circles -->
      <circle r="42" fill="none" stroke="#ff003c" stroke-dasharray="2,2" stroke-width="0.8" opacity="0.4" />
      <circle r="28" fill="none" stroke="#ffcc00" stroke-dasharray="3,3" stroke-width="0.8" opacity="0.3" />
      <circle r="14" fill="none" stroke="#ff003c" stroke-width="0.8" opacity="0.2" />
      <!-- Center dot -->
      <circle r="2" fill="#ff003c" />
      
      <!-- Rotating sweep -->
      <line x1="0" y1="0" x2="0" y2="-42" stroke="#ffcc00" stroke-width="2.5" filter="url(#glowGold)">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3s" repeatCount="indefinite" />
      </line>
      
      <!-- Targets -->
      <circle cx="-22" cy="-14" r="3.5" fill="#ff003c">
        <animate attributeName="opacity" values="0.1;1;0.1" dur="1.5s" repeatCount="indefinite" />
      </circle>
      <circle cx="20" cy="18" r="3.5" fill="#ffcc00">
        <animate attributeName="opacity" values="0.1;1;0.1" dur="1.5s" begin="0.75s" repeatCount="indefinite" />
      </circle>
    </g>
    
    <text x="630" y="182" fill="#ff003c" text-anchor="middle" class="status-text">LOCK: TARGET ACQUIRED</text>
    <text x="630" y="196" class="tech-label" text-anchor="middle">ROS 2 | SLAM | OPENCV | YOLOV8</text>
  </g>

  <!-- ==================== PANEL 4: EDGE TELEMETRY ==================== -->
  <g>
    <text x="880" y="38" fill="#ffcc00" text-anchor="middle" class="panel-title" filter="url(#glowGold)">EDGE TELEMETRY</text>
    
    <g transform="translate(880, 110)">
      <!-- Oscilloscope Box -->
      <rect x="-70" y="-35" width="140" height="70" fill="#050102" rx="3" stroke="#ff003c" stroke-width="1" opacity="0.4" />
      <!-- Crosshairs -->
      <line x1="-70" y1="0" x2="70" y2="0" stroke="#4a0012" stroke-width="0.8" opacity="0.5" />
      <line x1="0" y1="-35" x2="0" y2="35" stroke="#4a0012" stroke-width="0.8" opacity="0.5" />
      
      <!-- Oscilloscope Wave inside Clip-path -->
      <g clip-path="url(#telemetryClip)">
        <path d="M -140,0 Q -105,-22 -70,0 T 0,0 T 70,0 T 140,0" fill="none" stroke="#ffcc00" stroke-width="2" filter="url(#glowGold)">
          <animateTransform attributeName="transform" type="translate" from="0 0" to="-70 0" dur="2s" repeatCount="indefinite" />
        </path>
      </g>
    </g>
    
    <text x="880" y="182" fill="#ffffff" text-anchor="middle" class="status-text" opacity="0.9">SIGNAL: FUCKING DIABOLICAL</text>
    <text x="880" y="196" class="tech-label" text-anchor="middle">ESP32 | ARDUINO | GPIO | BUS</text>
  </g>
</svg>
