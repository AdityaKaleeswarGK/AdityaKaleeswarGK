<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080711" />
      <stop offset="50%" stop-color="#0b0e14" />
      <stop offset="100%" stop-color="#120822" />
    </linearGradient>

    <!-- Neon Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowMagenta" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Horizontal Lines Gradient (Fade out at top) -->
    <linearGradient id="gridFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0" />
      <stop offset="40%" stop-color="#00f0ff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.6" />
    </linearGradient>

    <!-- Grid Vertical Lines Gradient -->
    <linearGradient id="gridVertFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff0055" stop-opacity="0" />
      <stop offset="100%" stop-color="#ff0055" stop-opacity="0.4" />
    </linearGradient>

    <!-- Circle Pulse Gradient -->
    <radialGradient id="radialGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    /* Global Styles */
    text {
      font-family: 'Courier New', Courier, monospace, system-ui;
      user-select: none;
    }

    /* Scanline Sweeper */
    .scanner {
      animation: scanSweep 6s infinite linear;
      opacity: 0.7;
    }
    @keyframes scanSweep {
      0% { transform: translateY(-50px); }
      100% { transform: translateY(390px); }
    }

    /* Glitch Text Animations */
    .glitch-cyan {
      fill: #00f0ff;
      animation: jitterCyan 4s infinite steps(2, start);
    }
    .glitch-magenta {
      fill: #ff0055;
      animation: jitterMagenta 4s infinite steps(2, start);
    }
    .glitch-white {
      fill: #ffffff;
      animation: jitterWhite 4s infinite steps(1, start);
    }

    @keyframes jitterCyan {
      0%, 100% { transform: translate(0, 0); opacity: 0.9; }
      19% { transform: translate(0, 0); }
      20% { transform: translate(-3px, 1px); }
      21.5% { transform: translate(2px, -1px); }
      22% { transform: translate(0, 0); }
      60% { transform: translate(0, 0); }
      61% { transform: translate(-2px, -2px); }
      62% { transform: translate(1px, 2px); }
      63% { transform: translate(0, 0); }
    }

    @keyframes jitterMagenta {
      0%, 100% { transform: translate(0, 0); opacity: 0.9; }
      19% { transform: translate(0, 0); }
      20% { transform: translate(3px, -1px); }
      21.5% { transform: translate(-1px, 2px); }
      22% { transform: translate(0, 0); }
      60% { transform: translate(0, 0); }
      61% { transform: translate(2px, 1px); }
      62% { transform: translate(-2px, -1px); }
      63% { transform: translate(0, 0); }
    }

    @keyframes jitterWhite {
      0%, 100% { transform: translate(0, 0); }
      19.5% { transform: translate(0, 0); }
      20% { transform: translate(-1px, -1px); }
      21% { transform: translate(1px, 1px); }
      21.5% { transform: translate(0, 0); }
      60.5% { transform: translate(0, 0); }
      61% { transform: translate(1px, -1px); }
      61.5% { transform: translate(-1px, 1px); }
      62% { transform: translate(0, 0); }
    }

    /* Grid Perspective and Animating Grid Lines */
    .grid-h-line {
      stroke: url(#gridFade);
      stroke-width: 1.5;
      transform-origin: 50% 160px;
      animation: horizonScroll 3s infinite linear;
    }
    
    .grid-h-line:nth-child(2) { animation-delay: -0.6s; }
    .grid-h-line:nth-child(3) { animation-delay: -1.2s; }
    .grid-h-line:nth-child(4) { animation-delay: -1.8s; }
    .grid-h-line:nth-child(5) { animation-delay: -2.4s; }

    @keyframes horizonScroll {
      0% {
        transform: translateY(0px) scaleY(0.1);
        opacity: 0;
      }
      10% {
        opacity: 0.3;
      }
      90% {
        opacity: 0.9;
      }
      100% {
        transform: translateY(180px) scaleY(1.8);
        opacity: 0;
      }
    }

    /* Pulse effects for Nodes */
    .pulse-node {
      animation: pulseGlow 2s infinite ease-in-out;
    }
    .pulse-node-delayed {
      animation: pulseGlow 2s infinite ease-in-out 1s;
    }
    @keyframes pulseGlow {
      0%, 100% { r: 3px; opacity: 0.4; }
      50% { r: 5.5px; opacity: 1; filter: drop-shadow(0 0 4px #00f0ff); }
    }

    /* Terminal Cursor blinking */
    .cursor {
      animation: blink 1s infinite steps(2, start);
    }
    @keyframes blink {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }

    /* Sine wave moving path */
    .wave-path {
      stroke: #ff0055;
      stroke-width: 1.5;
      fill: none;
      stroke-dasharray: 800;
      stroke-dashoffset: 800;
      animation: drawWave 8s infinite linear;
      opacity: 0.5;
    }
    @keyframes drawWave {
      0% { stroke-dashoffset: 800; }
      50% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -800; }
    }
  </style>

  <!-- Background Rect -->
  <rect width="1000" height="340" fill="url(#bgGrad)" />

  <!-- Grid Perspective Area (Bottom Half) -->
  <g id="perspectiveGrid" clip-path="url(#gridClip)">
    <clipPath id="gridClip">
      <rect x="0" y="160" width="1000" height="180" />
    </clipPath>

    <!-- Perspective Converging Lines (Static) -->
    <g stroke="url(#gridVertFade)" stroke-width="1.5">
      <line x1="500" y1="160" x2="-300" y2="340" />
      <line x1="500" y1="160" x2="-100" y2="340" />
      <line x1="500" y1="160" x2="100" y2="340" />
      <line x1="500" y1="160" x2="300" y2="340" />
      <line x1="500" y1="160" x2="400" y2="340" />
      <line x1="500" y1="160" x2="450" y2="340" />
      <line x1="500" y1="160" x2="500" y2="340" />
      <line x1="500" y1="160" x2="550" y2="340" />
      <line x1="500" y1="160" x2="600" y2="340" />
      <line x1="500" y1="160" x2="700" y2="340" />
      <line x1="500" y1="160" x2="900" y2="340" />
      <line x1="500" y1="160" x2="1100" y2="340" />
      <line x1="500" y1="160" x2="1300" y2="340" />
    </g>

    <!-- Horizontal Lines (Animated to scroll forward) -->
    <g>
      <line x1="0" y1="160" x2="1000" y2="160" class="grid-h-line" />
      <line x1="0" y1="160" x2="1000" y2="160" class="grid-h-line" />
      <line x1="0" y1="160" x2="1000" y2="160" class="grid-h-line" />
      <line x1="0" y1="160" x2="1000" y2="160" class="grid-h-line" />
      <line x1="0" y1="160" x2="1000" y2="160" class="grid-h-line" />
    </g>
    
    <!-- Cyberpunk Sun Glow on the horizon -->
    <circle cx="500" cy="160" r="80" fill="url(#radialGlow)" opacity="0.8" />
  </g>

  <!-- Side framing layout lines -->
  <g stroke="#ab00ff" stroke-width="1" opacity="0.3">
    <!-- Top framing -->
    <line x1="20" y1="20" x2="980" y2="20" />
    <!-- Bottom framing -->
    <line x1="20" y1="320" x2="980" y2="320" />
    <!-- Side bounds -->
    <line x1="20" y1="20" x2="20" y2="320" />
    <line x1="980" y1="20" x2="980" y2="320" />
  </g>

  <!-- Tech corner brackets -->
  <path d="M 40,20 L 20,20 L 20,40" stroke="#00f0ff" stroke-width="3" fill="none" filter="url(#glowCyan)" />
  <path d="M 960,20 L 980,20 L 980,40" stroke="#00f0ff" stroke-width="3" fill="none" filter="url(#glowCyan)" />
  <path d="M 20,300 L 20,320 L 40,320" stroke="#ff0055" stroke-width="3" fill="none" filter="url(#glowMagenta)" />
  <path d="M 980,300 L 980,320 L 960,320" stroke="#ff0055" stroke-width="3" fill="none" filter="url(#glowMagenta)" />

  <!-- Left Side: Interactive Neural Network Visuals -->
  <g stroke="#00f0ff" stroke-width="0.7" opacity="0.4">
    <!-- Web connections -->
    <line x1="50" y1="50" x2="90" y2="80" />
    <line x1="90" y1="80" x2="130" y2="60" />
    <line x1="130" y1="60" x2="100" y2="120" />
    <line x1="100" y1="120" x2="50" y2="100" />
    <line x1="50" y1="100" x2="50" y2="50" />
    <line x1="90" y1="80" x2="100" y2="120" />
    <line x1="50" y1="50" x2="100" y2="120" />

    <!-- Pulse circles -->
    <circle cx="50" cy="50" r="4" class="pulse-node" fill="#00f0ff" />
    <circle cx="90" cy="80" r="3" class="pulse-node-delayed" fill="#ff0055" />
    <circle cx="130" cy="60" r="4.5" class="pulse-node" fill="#00f0ff" />
    <circle cx="100" cy="120" r="3.5" class="pulse-node-delayed" fill="#00f0ff" />
    <circle cx="50" cy="100" r="3" class="pulse-node" fill="#ff0055" />
  </g>

  <!-- Right Side: Animated Code / Signal Wave -->
  <g transform="translate(820, 45)">
    <!-- Sine wave visualization -->
    <rect x="-10" y="-10" width="150" height="90" fill="#0e0a1b" rx="5" stroke="#ab00ff" stroke-width="1" opacity="0.4" />
    <!-- Grid pattern inside the signal box -->
    <pattern id="sigGrid" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#241a42" stroke-width="0.5" />
    </pattern>
    <rect x="-10" y="-10" width="150" height="90" fill="url(#sigGrid)" />
    
    <!-- Moving wave path -->
    <path class="wave-path" d="M 0,35 Q 20,5 40,35 T 80,35 T 120,35" />
    <path class="wave-path" d="M 0,35 Q 20,65 40,35 T 80,35 T 120,35" style="animation-delay: -4s; stroke: #00f0ff;" />

    <text x="5" y="12" fill="#00f0ff" font-size="10" font-weight="bold" letter-spacing="1">SIGNAL RX: 98%</text>
    <circle cx="115" cy="8" r="3" fill="#39ff14" class="cursor" />
  </g>

  <!-- Center: Glitching Cyberpunk Title -->
  <g transform="translate(500, 100)" text-anchor="middle">
    <!-- Subtitle -->
    <text y="-25" fill="#ab00ff" font-size="14" font-weight="bold" letter-spacing="4" opacity="0.8">SYSTEM STATUS: ACTIVE</text>
    
    <!-- Glitched Main Title (3 layers for chromatic shift) -->
    <text y="15" font-size="38" font-weight="900" letter-spacing="6" class="glitch-cyan" filter="url(#glowCyan)">AdityaKaleeswarGK</text>
    <text y="15" font-size="38" font-weight="900" letter-spacing="6" class="glitch-magenta" filter="url(#glowMagenta)">AdityaKaleeswarGK</text>
    <text y="15" font-size="38" font-weight="900" letter-spacing="6" class="glitch-white">AdityaKaleeswarGK</text>

    <!-- Typing cursor indicator -->
    <text x="240" y="13" fill="#00f0ff" font-size="32" class="cursor">_</text>
  </g>

  <!-- Sub-bar Interface Text (Bottom Half) -->
  <g transform="translate(500, 150)" text-anchor="middle">
    <rect x="-180" y="5" width="360" height="2" fill="url(#lineGrad)" />
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0055" stop-opacity="0" />
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="1" />
      <stop offset="100%" stop-color="#ff0055" stop-opacity="0" />
    </linearGradient>
    <text y="24" fill="#00f0ff" font-size="12" letter-spacing="2" opacity="0.9">ML, ROBOTICS &amp; SYSTEMS</text>
  </g>

  <!-- Scanline Overlay Sweep -->
  <g class="scanner">
    <rect x="20" width="960" height="3" fill="#00f0ff" opacity="0.3" filter="url(#glowCyan)" />
    <rect x="20" width="960" height="30" fill="url(#scanGrad)" opacity="0.08" />
    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </linearGradient>
  </g>

  <!-- Realtime Bitstream Data details (bottom left / right corners) -->
  <text x="35" y="305" fill="#ff0055" font-size="9" opacity="0.6" letter-spacing="1">NODE: VIT_VELLORE // LOC: INDIA</text>
  <text x="800" y="305" fill="#00f0ff" font-size="9" opacity="0.6" letter-spacing="1">CORE: CUDA_12.x // ARCH: ORIN_NANO</text>
</svg>
